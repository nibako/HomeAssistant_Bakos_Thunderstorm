name: "Strong Thunderstorm"
version: "1.3.1"
slug: strong_thunderstorm
description: >-
  Strong Thunderstorm for Zigbee2MQTT with dynamic single-stream audio,
  optional realistic thunder timing and a parallel cozy living-room/fireplace mode.
arch:
  - amd64
  - aarch64
startup: application
boot: auto
stage: stable
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:weather-lightning-rainy
panel_title: Strong Thunderstorm
panel_admin: true
watchdog: http://[HOST]:[PORT:8099]/health
homeassistant_api: true
services:
  - mqtt:need
map:
  - type: media
    read_only: false
options:
  z2m_base_topic: zigbee2mqtt
  lightning_group: Thunderstorm-Lights
  lights: []
  browser_audio: true
  media_player: ""
  media_player_audio: false
  rain_volume: 100
  thunder_volume: 100
  sync_offset_ms: 0
  duration_minutes: 0
  storm_intensity: original
  thunder_timing: original
  cozy_enabled: false
  gentle_end_seconds: 8
  cozy_scene: ""
  cozy_lights: []
  cozy_media_player: ""
  fireplace_media: media-source://media_source/local/fireplace.mp4
  fireplace_volume: 35
  cozy_restore_on_stop: true
  restore_on_stop: true
  log_level: info
schema:
  z2m_base_topic: str
  lightning_group: str
  lights:
    - str
  browser_audio: bool
  media_player: str
  media_player_audio: bool
  rain_volume: int(0,100)
  thunder_volume: int(0,100)
  sync_offset_ms: int(-1500,1500)
  duration_minutes: list(0|15|30|60|90)
  storm_intensity: list(original|calm|extreme)
  thunder_timing: list(original|realistic)
  cozy_enabled: bool
  gentle_end_seconds: list(0|5|8|12)
  cozy_scene: str
  cozy_lights:
    - str
  cozy_media_player: str
  fireplace_media: str
  fireplace_volume: int(0,100)
  cozy_restore_on_stop: bool
  restore_on_stop: bool
  log_level: list(debug|info|warning|error)
